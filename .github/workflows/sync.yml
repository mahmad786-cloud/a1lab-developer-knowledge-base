name: Auto-Sync A1Lab Forum Index

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync latest forum Q&A and llms.txt
        run: python scripts/sync_forum.py

      - name: Commit and push updated index
        run: |
          git config user.name "A1Lab Sync Bot"
          git config user.email "bot@a1lab.tech"
          git add README.md llms.txt
          git diff --staged --quiet || git commit -m "chore: auto-sync technical Q&A from forum.a1lab.tech"
          git push
